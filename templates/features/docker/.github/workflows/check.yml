name: Container quality
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose run --rm app npm ci
      - run: docker compose run --rm app npm run check
      - run: docker compose run --build --rm browser
      # CI checks the unconfigured scaffold; do not inject production credentials.
      - run: docker compose -f compose.production.yaml up --build --wait web
      - run: curl --fail http://localhost:3000
      - if: always()
        run: docker compose -f compose.production.yaml down && docker compose down
